<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spelling">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#16342a">
<link rel="apple-touch-icon" href="spelling-icon.png">
<link rel="icon" href="spelling-icon.png">
<title>Spelling Chalkboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root {
    --board-top: #16342a;
    --board-bottom: #0e241c;
    --rail: #0a1d16;
    --chalk: #f6f0e2;
    --chalk-dim: #cfe3d6;
    --chalk-faint: #8fac9c;
    --ink: #17302a;
    --ink-soft: #4a6259;
    --gold: #e7b64c;
    --gold-ink: #4a3410;
    --good: #3f9d63;
    --good-bg: #e5f4e9;
    --bad: #d1584c;
    --bad-bg: #fbe8e5;
    --line: #d9d0bb;
    --font-display: 'Caveat', 'Segoe Script', cursive;
    --font-body: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-body);
    color: var(--chalk);
    background:
      radial-gradient(circle at 18% 24%, rgba(255,255,255,0.04) 0, rgba(255,255,255,0.04) 1px, transparent 1.6px),
      radial-gradient(circle at 68% 78%, rgba(255,255,255,0.035) 0, rgba(255,255,255,0.035) 1px, transparent 1.6px),
      radial-gradient(circle at 40% 55%, rgba(255,255,255,0.025) 0, rgba(255,255,255,0.025) 1px, transparent 1.6px),
      linear-gradient(165deg, var(--board-top), var(--board-bottom));
    background-size: 46px 46px, 63px 63px, 38px 38px, 100% 100%;
    display: flex;
    justify-content: center;
    padding: 28px 16px 56px;
  }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  .wrap { width: 100%; max-width: 460px; }

  .brand { text-align: center; margin-bottom: 22px; }
  .brand h1 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 2.5rem;
    margin: 0;
    color: var(--chalk);
    letter-spacing: 0.01em;
    text-shadow: 0 0 1px rgba(255,255,255,0.25), 0 2px 0 rgba(0,0,0,0.15);
  }
  .brand .rule {
    width: 96px;
    height: 3px;
    margin: 6px auto 10px;
    border-radius: 3px;
    background: var(--gold);
    opacity: 0.85;
  }
  .brand p {
    margin: 0;
    font-size: 0.92rem;
    color: var(--chalk-dim);
  }

  .screen { display: none; }
  .screen.active { display: block; }

  .backlink {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: var(--chalk-dim);
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 4px 0 14px;
  }
  .backlink:hover { color: var(--gold); }

  .section-title {
    font-family: var(--font-display);
    font-size: 1.7rem;
    font-weight: 700;
    color: var(--chalk);
    margin: 0 0 2px;
  }
  .section-sub {
    font-size: 0.88rem;
    color: var(--chalk-dim);
    margin: 0 0 18px;
  }

  /* --- Picker cards --- */
  .picker-grid { display: flex; flex-direction: column; gap: 14px; }
  .board-card {
    position: relative;
    background: var(--chalk);
    color: var(--ink);
    border-radius: 4px;
    padding: 16px 20px;
    text-align: left;
    border: none;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(0,0,0,0.28), 0 1px 0 rgba(255,255,255,0.04) inset;
    display: flex;
    align-items: center;
    gap: 14px;
    transform: rotate(var(--tilt, 0deg));
  }
  .board-card:nth-child(odd) { --tilt: -0.6deg; }
  .board-card:nth-child(even) { --tilt: 0.5deg; }
  .board-card::before {
    content: "";
    position: absolute;
    top: -8px; left: 22px;
    width: 34px; height: 14px;
    background: rgba(231,182,76,0.55);
    border: 1px solid rgba(231,182,76,0.7);
    transform: rotate(-3deg);
  }
  .board-card .emoji { font-size: 1.7rem; line-height: 1; }
  .board-card .titles { flex: 1; min-width: 0; }
  .board-card .t1 { display: block; font-size: 1.1rem; font-weight: 800; }
  .board-card .t2 { display: block; font-size: 0.8rem; color: var(--ink-soft); margin-top: 3px; }
  .board-card .arrow { color: var(--ink-soft); font-size: 1.3rem; }

  /* --- Tabs --- */
  .tabs {
    display: flex;
    gap: 22px;
    border-bottom: 1px dashed rgba(255,255,255,0.22);
    margin-bottom: 20px;
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--chalk-faint);
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 700;
    padding: 6px 2px 12px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -1px;
  }
  .tab-btn.active {
    color: var(--chalk);
    border-bottom-color: var(--gold);
  }
  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--chalk);
    color: var(--ink);
    border-radius: 10px;
    padding: 22px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.3);
  }

  .progress-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--gold);
    background: rgba(231,182,76,0.12);
    border: 1px solid rgba(231,182,76,0.35);
    border-radius: 999px;
    padding: 4px 11px;
    margin-bottom: 18px;
  }
  .sync-note { font-size: 0.72rem; color: var(--chalk-faint); margin: -12px 0 18px; }

  /* --- Overall progress (partial credit toward mastery, not just the
     binary mastered/not-yet count) --- */
  .overall-progress { margin: -8px 0 18px; }
  .overall-progress-label {
    font-size: 0.78rem;
    color: var(--chalk-dim);
    margin-bottom: 5px;
  }
  .overall-progress-bar {
    height: 8px;
    background: rgba(255,255,255,0.14);
    border-radius: 4px;
    overflow: hidden;
  }
  .overall-progress-fill {
    height: 100%;
    background: var(--good);
    transition: width 0.3s;
  }

  .prompt-progress {
    text-align: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ink-soft);
    margin: -6px 0 12px;
  }

  /* --- Setup fields --- */
  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-weight: 800;
    margin-bottom: 8px;
    font-size: 0.82rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
  }
  .opt-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .opt-row button {
    flex: 1;
    min-width: 90px;
    padding: 10px 8px;
    border-radius: 8px;
    border: 2px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
  }
  .opt-row button.selected {
    border-color: var(--good);
    background: var(--good-bg);
    color: #205c37;
  }
  .opt-row button:disabled { opacity: 0.45; cursor: default; }

  .voice-row { display: flex; gap: 8px; align-items: center; }
  .voice-row select {
    flex: 1;
    min-width: 0;
    padding: 10px 8px;
    border-radius: 8px;
    border: 2px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.85rem;
    font-weight: 700;
  }
  .voice-row button {
    padding: 10px 14px;
    border-radius: 8px;
    border: 2px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    font-family: var(--font-body);
    font-weight: 800;
    cursor: pointer;
    flex-shrink: 0;
  }

  .primary-btn {
    width: 100%;
    padding: 14px;
    border-radius: 9px;
    border: none;
    background: var(--gold);
    color: var(--gold-ink);
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    margin-top: 4px;
  }
  .primary-btn:active { transform: scale(0.98); }
  .secondary-btn {
    width: 100%;
    padding: 12px;
    border-radius: 9px;
    border: 2px solid var(--ink);
    background: transparent;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.92rem;
    font-weight: 800;
    cursor: pointer;
    margin-top: 10px;
  }

  /* --- Flashcards (Study) --- */
  .flash-progress {
    text-align: center;
    font-size: 0.85rem;
    color: var(--chalk-dim);
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }
  .flashcard {
    background: var(--chalk);
    color: var(--ink);
    border-radius: 10px;
    min-height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(0,0,0,0.3);
    user-select: none;
  }
  .flashcard .eyebrow {
    font-family: var(--font-body);
    font-size: 0.72rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .flashcard .sentence {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 1.2rem;
    line-height: 1.4;
    word-break: break-word;
  }
  .flashcard .sentence b { color: #205c37; text-decoration: underline; text-decoration-color: var(--good); text-decoration-thickness: 3px; }
  .flashcard .hint {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin-top: 12px;
  }
  .flashcard .status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 0.75rem;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: 999px;
    margin-top: 10px;
  }
  .status-mastered { background: var(--good-bg); color: #205c37; }
  .status-learning { background: rgba(231,182,76,0.18); color: #7a5a10; }
  .status-practice { background: var(--bad-bg); color: #8f2e24; }

  .flash-nav {
    display: flex;
    gap: 8px;
    margin-top: 14px;
  }
  .flash-nav button {
    flex: 1;
    padding: 12px;
    border-radius: 9px;
    border: 1px dashed rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.06);
    color: var(--chalk);
    font-family: var(--font-body);
    font-weight: 700;
    cursor: pointer;
  }

  /* --- Quiz play --- */
  .quiz-progress {
    display: flex;
    justify-content: space-between;
    font-size: 0.85rem;
    color: var(--chalk-dim);
    margin-bottom: 8px;
    font-variant-numeric: tabular-nums;
  }
  .progress-bar {
    height: 6px;
    background: rgba(255,255,255,0.14);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.2s;
  }
  .prompt-label {
    text-align: center;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-soft);
    margin-bottom: 10px;
    font-weight: 800;
  }
  .prompt-sentence {
    font-weight: 700;
    font-size: 1.2rem;
    line-height: 1.45;
    text-align: center;
    margin: 4px 0 16px;
    text-wrap: balance;
  }
  .speak-row { display: flex; justify-content: center; margin-bottom: 14px; }
  .speak-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: #fffdf8;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.88rem;
    font-weight: 800;
    cursor: pointer;
  }
  .speak-btn:disabled { opacity: 0.4; cursor: default; }

  .type-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .type-row input {
    flex: 1;
    padding: 13px;
    border-radius: 9px;
    border: 2px solid var(--line);
    font-family: var(--font-body);
    font-size: 1rem;
    background: #fffdf8;
    color: var(--ink);
  }
  .type-row input.correct { border-color: var(--good); background: var(--good-bg); }
  .type-row input.wrong { border-color: var(--bad); background: var(--bad-bg); }
  .feedback {
    font-size: 0.9rem;
    font-weight: 700;
    min-height: 22px;
    margin-bottom: 6px;
  }
  .feedback.good { color: #205c37; }
  .feedback.bad { color: #8f2e24; }

  /* --- Results --- */
  .score-big {
    font-family: var(--font-body);
    font-size: 2.5rem;
    font-weight: 800;
    text-align: center;
    margin: 4px 0;
    font-variant-numeric: tabular-nums;
  }
  .score-sub {
    text-align: center;
    color: var(--ink-soft);
    margin-bottom: 6px;
    font-size: 0.95rem;
  }
  .score-progress {
    text-align: center;
    font-size: 0.85rem;
    font-weight: 700;
    color: #205c37;
    margin-bottom: 18px;
  }
  .review-list {
    list-style: none;
    padding: 0;
    margin: 0 0 16px;
  }
  .review-list li {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
    font-size: 0.92rem;
  }
  .review-list b { color: #8f5b12; white-space: nowrap; }
  .review-list span { text-align: right; color: var(--ink-soft); }
  /* --- Mastery progress: grey not tried · red to fix · orange on the way (1 in a row) · yellow nearly there (2) · green mastered --- */
  .mastery-panel { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16); border-radius: 10px; padding: 10px 12px 9px; margin: 0 0 14px; }
  .mastery-panel.done { background: rgba(63,157,99,0.28); border-color: #5fc287; }
  .mastery-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 0.92rem; margin-bottom: 7px; }
  .mastery-head b { font-size: 1.05rem; }
  .mastery-head .rule { font-size: 0.72rem; color: var(--chalk-faint); text-align: right; }
  .mbar { display: flex; height: 10px; border-radius: 6px; overflow: hidden; background: rgba(255,255,255,0.12); }
  .mbar .seg { height: 100%; }
  .mbar .seg.m, .k.m { background: #3f9d63; }
  .mbar .seg.n, .k.n { background: #f2d04b; }
  .mbar .seg.o, .k.o { background: #ef8f2f; }
  .mbar .seg.w, .k.w { background: var(--bad); }
  .mbar .seg.f { background: rgba(255,255,255,0.16); }
  .mbar.on-card { background: #e6dfcc; height: 8px; }
  .mbar.on-card .seg.f { background: #d9d0bb; }
  .mlegend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 7px; font-size: 0.76rem; color: var(--chalk-dim); }
  .mlegend .k { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .k.f { background: rgba(255,255,255,0.3); }
  .on-card-legend { color: var(--ink-soft); }
  .on-card-legend .k.f { background: #d9d0bb; }
  .dots { letter-spacing: 2px; }
  .dots.d1 { color: #ef8f2f; } .dots.d2 { color: #d9b21d; } .dots.d3 { color: #3f9d63; }
  .status-nearly { background: rgba(242,208,75,0.32); color: #665200; }
  .status-way { background: rgba(239,143,47,0.2); color: #8a4a0c; }
  .board-card .prog { display: block; margin-top: 7px; }
  .board-card .prog-text { display: block; font-size: 0.74rem; font-weight: 700; color: var(--ink-soft); margin-top: 4px; }
  .board-card.done { background: #dff1e5; outline: 3px solid #3f9d63; outline-offset: -3px; }
  .board-card.done .prog-text { color: #205c37; }
  .round-note { font-size: 0.78rem; color: var(--ink-soft); margin: 8px 0 0; line-height: 1.35; }
  .result-mastery { background: #fffdf8; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; margin: 4px 0 16px; font-size: 0.86rem; color: var(--ink); }
  .result-mastery .row { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <h1>Spelling Chalkboard</h1>
    <div class="rule"></div>
    <p>Michaelmas 2026 spelling lists</p>
  </div>

  <!-- SCREEN 1: WEEK PICKER -->
  <div class="screen active" id="screen-week">
    <div class="section-title">Spelling</div>
    <p class="section-sub" id="weekScreenSub">Pick a week to practise</p>
    <div class="picker-grid" id="weekGrid"></div>
  </div>

  <!-- SCREEN 2: MAIN TRAINER -->
  <div class="screen" id="screen-main">
    <button class="backlink" id="backToWeek">&larr; Change week</button>
    <div class="section-title" id="mainTitle">Week 1</div>
    <p class="section-sub" id="mainSubtitle">Test w/c ...</p>
    <div class="mastery-panel hidden" id="masteryPanel"></div>
    <p class="sync-note" id="syncNote"></p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="flash">Study</button>
      <button class="tab-btn" data-tab="quiz">Spelling Test</button>
    </div>

    <!-- STUDY (FLASHCARDS) -->
    <div class="panel active" id="panel-flash">
      <div class="flash-progress" id="flashProgress">1 / 13</div>
      <div class="flashcard" id="flashcard">
        <div>
          <div class="eyebrow hidden" id="flashGroup">Group</div>
          <div class="sentence" id="flashSentence">sentence</div>
          <div class="hint" id="flashHint">tap to reveal the word</div>
          <div class="status hidden" id="flashStatus">new</div>
        </div>
      </div>
      <div class="flash-nav">
        <button id="flashPrev">&larr; Prev</button>
        <button id="flashShuffle">Shuffle</button>
        <button id="flashNext">Next &rarr;</button>
      </div>
    </div>

    <!-- SPELLING TEST SETUP / PLAY / RESULTS -->
    <div class="panel" id="panel-quiz">

      <div class="card" id="quizSetup">
        <div class="field">
          <label id="setFieldLabel">Words</label>
          <div class="opt-row" id="setRow">
            <button data-val="round" class="selected" id="roundBtn">Practice round</button>
            <button data-val="full" id="fullBtn">Full test</button>
          </div>
          <p class="round-note" id="roundNote"></p>
        </div>
        <div class="field hidden" id="voiceField">
          <label>Voice</label>
          <div class="voice-row">
            <select id="voiceSelect"></select>
            <button type="button" id="voiceTestBtn" title="Hear a sample word">&#9654;</button>
          </div>
        </div>
        <button class="primary-btn" id="startQuizBtn">Start spelling test</button>
      </div>

      <div id="quizPlay" class="hidden">
        <div class="quiz-progress">
          <span id="quizCounter">Question 1 / 13</span>
          <span id="quizScore">Score: 0</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        <div class="card">
          <div class="prompt-label" id="promptLabel">Fill in the missing word</div>
          <div class="prompt-sentence" id="promptSentence">sentence with a _____ in it</div>
          <div class="prompt-progress hidden" id="promptProgress"></div>
          <div class="speak-row">
            <button class="speak-btn" id="speakBtn">&#128266; Hear it</button>
          </div>
          <form id="typeForm" autocomplete="off" action="javascript:void(0);">
            <div class="type-row">
              <input type="text" id="typeInput" name="spelling-answer" placeholder="Type the word" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" data-gramm="false" data-gramm_editor="false" data-enable-grammarly="false">
            </div>
          </form>
          <button class="primary-btn" id="typeSubmit">Check</button>
          <div class="feedback" id="feedback"></div>
          <button class="primary-btn hidden" id="nextBtn">Next &rarr;</button>
        </div>
      </div>

      <div id="quizResults" class="hidden">
        <div class="card">
          <div class="score-big" id="resultScore">0 / 13</div>
          <div class="score-sub" id="resultMsg">Nice work!</div>
          <div class="score-progress" id="resultProgress"></div>
          <div id="resultMastery"></div>
          <div id="resultReviewWrap">
            <label style="font-weight:800; font-size:0.85rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft);">Review your misses</label>
            <ul class="review-list" id="reviewList"></ul>
          </div>
          <button class="primary-btn" id="retryPracticeBtn">Next practice round</button>
          <button class="secondary-btn" id="restartAllBtn">Full test</button>
        </div>
      </div>

    </div>
  </div>

// ================= UTIL =================
function normalize(s){
  return s.toString().trim().toLowerCase();
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
// Replaces the target word inside its sentence with a blank, so the
// sentence itself is the prompt (works with or without audio, and is
// what disambiguates near-homophones like allowed/aloud).
function blankSentence(sentence, word){
  const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp("\\b" + escaped + "\\b", "i");
  return sentence.replace(re, "_____");
}
function boldSentence(sentence, word){
  const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp("\\b(" + escaped + ")\\b", "i");
  return sentence.replace(re, "<b>$1</b>");
}

      });
    });
  });

}

// ================= MASTERY (saved in this browser) =================
// A word is MASTERED after 3 right in a row. A wrong answer resets only that
// word — never the whole list — and progress is saved after every answer.
// Colours: grey not tried · red to fix · orange on the way (1 in a row) ·
// yellow nearly there (2 in a row) · green mastered.
const STREAK_TO_MASTER = 3;
const ROUND_SIZE = 12;        // a practice round is at most this long…
const REVIEW_PER_ROUND = 2;   // …including a quick check of 2 mastered words
let statsCache = {}; // { [item.key]: {streak, attempts, t: last asked} }
function statsStorageKey(weekId){
  return "spellingChalkboard:" + weekId;
}
// Before this version touches anything, keep a copy of all saved progress (once).
(function backupProgressOnce(){
  try {
    const tag = "spellingChalkboard:backup:v9";
    if(localStorage.getItem(tag)) return;
    const snap = {};
    for(let i = 0; i < localStorage.length; i++){
      const k = localStorage.key(i);
      if(k && k.indexOf("spellingChalkboard:") === 0 && k.indexOf("spellingChalkboard:backup") !== 0) snap[k] = localStorage.getItem(k);
    }
    localStorage.setItem(tag, JSON.stringify({at: new Date().toISOString(), data: snap}));
  } catch(e){ /* storage unavailable */ }
})();
function scRestoreBackup(){
  const b = JSON.parse(localStorage.getItem("spellingChalkboard:backup:v9") || "null");
  if(!b) return "no backup";
  Object.keys(b.data).forEach(k => localStorage.setItem(k, b.data[k]));
  return "restored " + Object.keys(b.data).length + " saved weeks from " + b.at;
}
function readStats(weekId){
  try { const raw = localStorage.getItem(statsStorageKey(weekId)); return (raw && JSON.parse(raw).words) || {}; }
  catch(e){ return {}; }
}
// "new" · "wrong" · "way" (1 in a row) · "nearly" (2 in a row) · "mastered"
function itemState(stats, key){
  const r = stats[key];
  if(!r || !r.attempts) return "new";
  if(r.streak >= STREAK_TO_MASTER) return "mastered";
  if(r.streak === 0) return "wrong";
  return r.streak >= 2 ? "nearly" : "way";
}
const STATE_WORDS = {way: "on the way", nearly: "nearly there"};
function dots(n){ let o = ""; for(let i = 0; i < STREAK_TO_MASTER; i++) o += i < n ? "●" : "○"; return o; }
function dotsHTML(n){ return '<span class="dots d' + n + '">' + dots(n) + '</span>'; }
function wordStatus(key){ // flashcard chip
  const st = itemState(statsCache, key);
  if(st === "new") return null;
  if(st === "mastered") return {label:"★ mastered", cls:"status-mastered"};
  if(st === "wrong") return {label:"to fix ○○○", cls:"status-practice"};
  const n = statsCache[key].streak;
  return {label: dots(n) + " " + STATE_WORDS[st] + " (" + n + " of 3 in a row)", cls: st === "nearly" ? "status-nearly" : "status-way"};
}
function summarise(items, stats){
  const sum = {total: items.length, mastered: 0, nearly: 0, way: 0, wrong: 0, fresh: 0};
  items.forEach(it => { const st = itemState(stats, it.key); if(st === "new") sum.fresh++; else sum[st]++; });
  return sum;
}
function countMastered(){ return summarise(ITEMS, statsCache).mastered; }
function stackedBar(sum, onCard){
  const seg = (n, c) => n ? '<span class="seg ' + c + '" style="width:' + (100 * n / sum.total) + '%"></span>' : '';
  return '<div class="mbar' + (onCard ? ' on-card' : '') + '">' +
    seg(sum.mastered, "m") + seg(sum.nearly, "n") + seg(sum.way, "o") + seg(sum.wrong, "w") + seg(sum.fresh, "f") + '</div>';
}
function legend(sum, onCard){
  const part = (n, c, label) => n ? '<span><span class="k ' + c + '"></span>' + n + ' ' + label + '</span>' : '';
  return '<div class="mlegend' + (onCard ? ' on-card-legend' : '') + '">' +
    part(sum.mastered, "m", "mastered") + part(sum.nearly, "n", "nearly there") + part(sum.way, "o", "on the way") +
    part(sum.wrong, "w", "to fix") + part(sum.fresh, "f", "not tried yet") + '</div>';
}
function loadStats(week){
  statsCache = readStats(week.id);
  const note = document.getElementById("syncNote");
  let ok = true;

  note.textContent = ok ? "Progress is saved on this device after every answer." : "Progress can't be saved on this device right now.";
  refreshStatsUI();
}
function recordResult(item, correct){
  const prev = statsCache[item.key] || {streak:0, attempts:0};
  statsCache[item.key] = {
    streak: correct ? Math.min(prev.streak + 1, STREAK_TO_MASTER) : 0,
    attempts: prev.attempts + 1,
    t: Date.now()
  };
  try { localStorage.setItem(statsStorageKey(currentWeek.id), JSON.stringify({ words: statsCache })); } catch(e){ /* best effort */ }
  refreshStatsUI();
}
// The progress panel at the top of a week
function refreshStatsUI(){
  if(!ITEMS.length) return;
  const sum = summarise(ITEMS, statsCache);
  const done = sum.mastered === sum.total;
  const panel = document.getElementById("masteryPanel");
  const head = done
    ? '<b>★ All mastered!</b><span class="rule">Keep it fresh with a practice round now and then</span>'
    : '<span><b>' + sum.mastered + ' / ' + sum.total + '</b> words mastered</span><span class="rule">3 right in a row = mastered</span>';
  panel.innerHTML = '<div class="mastery-head">' + head + '</div>' + stackedBar(sum, false) + legend(sum, false);
  panel.classList.toggle("done", done);
  panel.classList.remove("hidden");
  updateRoundButtons();
  renderFlashStatus();
}
// What a practice round contains. All the words are mixed in together: up to
// 4 she got wrong last time, then about half new words and half words on the
// way (the ones asked longest ago first), plus a quick check of 2 mastered
// words. Never more than ROUND_SIZE; shorter when little is left.
function buildPracticeRound(pool){
  const by = {wrong: [], way: [], nearly: [], new: [], mastered: []};
  pool.forEach(it => by[itemState(statsCache, it.key)].push(it));
  const lastAsked = it => (statsCache[it.key] && statsCache[it.key].t) || 0;
  const oldestFirst = list => shuffle(list).sort((a, b) => lastAsked(a) - lastAsked(b));
  const wrong = oldestFirst(by.wrong), learning = oldestFirst(by.way.concat(by.nearly)), fresh = shuffle(by.new);
  if(!wrong.length && !learning.length && !fresh.length) return shuffle(by.mastered).slice(0, Math.min(6, by.mastered.length));
  const review = Math.min(REVIEW_PER_ROUND, by.mastered.length);
  const slots = ROUND_SIZE - review;
  const picked = [];
  const take = (list, k) => { while(k-- > 0 && list.length && picked.length < slots) picked.push(list.shift()); };
  take(wrong, 4);
  take(fresh, Math.ceil((slots - picked.length) / 2));
  take(learning, slots - picked.length);
  take(fresh, slots - picked.length);
  take(wrong, slots - picked.length);
  return shuffle(picked.concat(shuffle(by.mastered).slice(0, review)));
}
function roundLength(){
  const left = ITEMS.filter(it => itemState(statsCache, it.key) !== "mastered").length;
  const mastered = ITEMS.length - left;
  return {left, len: left ? Math.min(ROUND_SIZE, left + Math.min(REVIEW_PER_ROUND, mastered)) : Math.min(6, mastered)};
}
function updateRoundButtons(){
  if(!currentWeek || !ITEMS.length) return;
  const {left, len} = roundLength();
  document.getElementById("roundBtn").textContent = (left ? "Practice round (" : "Review round (") + len + ")";
  document.getElementById("fullBtn").textContent = "Full test (all " + ITEMS.length + ")";
  document.getElementById("roundNote").textContent = left
    ? "Practice round: any words to fix first, then a mix of new words and ones on the way, plus a quick check of a couple you've mastered. A word you get wrong comes back once later in the round."
    : "Everything here is mastered — a review round checks a few at random. Full test = every word once, like the real test.";
  document.getElementById("retryPracticeBtn").textContent = left ? "Next practice round (" + len + ")" : "Review round (" + len + ")";
  document.getElementById("restartAllBtn").textContent = "Full test (all " + ITEMS.length + ")";
}

let flashOrder = [];
let flashIdx = 0;
let flashRevealed = false;

function renderFlash(){
  if(!ITEMS.length) return;
  const item = ITEMS[flashOrder[flashIdx]];
  const sentEl = document.getElementById("flashSentence");
  sentEl.innerHTML = flashRevealed ? boldSentence(item.sentence, item.word) : blankSentence(item.sentence, item.word);
  document.getElementById("flashHint").textContent = flashRevealed ? "tap to hide the word again" : "tap to reveal the word";
  document.getElementById("flashProgress").textContent = (flashIdx+1) + " / " + ITEMS.length;

  const groupEl = document.getElementById("flashGroup");
  if(item.group){ groupEl.textContent = item.group; groupEl.classList.remove("hidden"); }
  else groupEl.classList.add("hidden");

  renderFlashStatus();
}
function renderFlashStatus(){
  if(!ITEMS.length) return;
  const item = ITEMS[flashOrder[flashIdx]];
  const el = document.getElementById("flashStatus");
  const st = wordStatus(item.key);
  if(!st){ el.classList.add("hidden"); return; }
  el.classList.remove("hidden");
  el.className = "status " + st.cls;
  el.textContent = st.label;
}
document.getElementById("flashcard").addEventListener("click", ()=>{
  flashRevealed = !flashRevealed;
  renderFlash();
});
document.getElementById("flashNext").addEventListener("click", ()=>{
  flashIdx = (flashIdx+1) % ITEMS.length;
  flashRevealed = false;
  renderFlash();
});
document.getElementById("flashPrev").addEventListener("click", ()=>{
  flashIdx = (flashIdx-1+ITEMS.length) % ITEMS.length;
  flashRevealed = false;
  renderFlash();
});
document.getElementById("flashShuffle").addEventListener("click", ()=>{
  flashOrder = shuffle(flashOrder);
  flashIdx = 0;
  flashRevealed = false;
  renderFlash();
});

// ================= SPELLING TEST SETUP =================
let wordSet = "round"; // "round" (practice round) or "full" (every word once)
document.getElementById("setRow").addEventListener("click", (e)=>{
  const btn = e.target.closest("button");
  if(!btn || btn.disabled) return;
  [...document.getElementById("setRow").children].forEach(b=>b.classList.remove("selected"));
  btn.classList.add("selected");
  wordSet = btn.dataset.val;
});

document.getElementById("startQuizBtn").addEventListener("click", startQuiz);
document.getElementById("retryPracticeBtn").addEventListener("click", ()=>{
  wordSet = "round"; setSelected("setRow", "round");
  startQuiz();
});
document.getElementById("restartAllBtn").addEventListener("click", ()=>{
  wordSet = "full"; setSelected("setRow", "full");
  startQuiz();
});

// ================= SPELLING TEST PLAY =================
let quizQueue = [];
let quizIdx = 0;
let quizScore = 0;
let quizMissed = [];
let quizRetried = new Set();       // words already given their one "comes back later" retry
let quizNewlyMastered = new Set(); // words that reached 3 in a row this round
let answered = false;
const speechOK = ("speechSynthesis" in window);

// ================= VOICE PICKER =================
// Which voices exist (and how they sound) is entirely up to the device, so
// rather than guess at one, let her pick from whatever's actually installed
// and remember the choice on this device.
let availableVoices = [];
let selectedVoiceName = null;

function loadVoiceList(){
  if(!speechOK) return;
  availableVoices = window.speechSynthesis.getVoices() || [];
  const english = availableVoices.filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  const list = english.length ? english : availableVoices;
  const select = document.getElementById("voiceSelect");
  const field = document.getElementById("voiceField");
  if(!list.length){
    field.classList.add("hidden");
    return;
  }
  field.classList.remove("hidden");

  let saved = null;
  try { saved = localStorage.getItem("spellingChalkboard:voice"); } catch(e){ /* ignore */ }
  const stillAvailable = saved && list.some(v => v.name === saved);
  const preferred = list.find(v => v.lang && v.lang.toLowerCase() === "en-gb");
  const chosen = stillAvailable ? saved : (preferred ? preferred.name : list[0].name);

  select.innerHTML = "";
  list.forEach(v=>{
    const opt = document.createElement("option");
    opt.value = v.name;
    opt.textContent = v.name + " (" + v.lang + ")";
    select.appendChild(opt);
  });
  select.value = chosen;
  selectedVoiceName = chosen;
}
if(speechOK){
  loadVoiceList();
  // Chrome/Android load the voice list asynchronously; Safari/iOS usually
  // has it immediately, but this covers both.
  window.speechSynthesis.onvoiceschanged = loadVoiceList;
}
const voiceSelectEl = document.getElementById("voiceSelect");
if(voiceSelectEl){
  voiceSelectEl.addEventListener("change", (e)=>{
    selectedVoiceName = e.target.value;
    try { localStorage.setItem("spellingChalkboard:voice", selectedVoiceName); } catch(e){ /* ignore */ }
  });
}
const voiceTestBtn = document.getElementById("voiceTestBtn");
if(voiceTestBtn){
  voiceTestBtn.addEventListener("click", ()=> speakWord("hello"));
}

function startQuiz(){
  pendingNext = null;
  quizQueue = wordSet === "full" ? shuffle(ITEMS) : buildPracticeRound(ITEMS);
  quizIdx = 0;
  quizScore = 0;
  quizMissed = [];
  quizRetried = new Set();
  quizNewlyMastered = new Set();
  document.getElementById("quizSetup").classList.add("hidden");
  document.getElementById("quizResults").classList.add("hidden");
  document.getElementById("quizPlay").classList.remove("hidden");
  renderQuestion();
}

// Reads just the word itself — once per press, and no sentence — so the
// only context she gets for near-homophones (allowed/aloud, affect/effect)
// is the blanked sentence already on screen, not a spoken giveaway. Uses
// whichever voice is currently selected in the setup screen.
function speakWord(word){
  if(!speechOK) return;
  try {
    window.speechSynthesis.cancel(); // stop any reading still in progress so presses don't stack
    const u = new SpeechSynthesisUtterance(word);
    const v = availableVoices.find(v => v.name === selectedVoiceName);
    if(v){ u.voice = v; u.lang = v.lang; }
    else { u.lang = "en-GB"; }
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  } catch(e){ /* ignore — sentence-with-blank still works without audio */ }
}
function speakItem(item){
  speakWord(item.word);
}

function renderQuestion(){
  answered = false;
  const item = quizQueue[quizIdx];
  document.getElementById("quizCounter").textContent = (wordSet === "full" ? "Full test · " : "") + "Question " + (quizIdx+1) + " / " + quizQueue.length;
  document.getElementById("quizScore").textContent = "Score: " + quizScore;
  document.getElementById("progressFill").style.width = (100*quizIdx/quizQueue.length) + "%";
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("promptLabel").textContent = item.group || "Fill in the missing word";
  document.getElementById("promptSentence").textContent = blankSentence(item.sentence, item.word);

  // Shows how close THIS word already is to mastered, so a run of correct
  // answers reads as visible progress even before it flips to "mastered".
  showWordProgress(item);

  const speakBtn = document.getElementById("speakBtn");
  speakBtn.disabled = !speechOK;
  speakBtn.textContent = speechOK ? "\u{1F50A} Hear it" : "\u{1F507} Audio not available here";
  speakBtn.onclick = ()=> speakItem(item);

  document.getElementById("nextBtn").classList.add("hidden");
  document.getElementById("typeSubmit").classList.remove("hidden");

  const input = document.getElementById("typeInput");
  input.value = "";
  input.className = "";
  input.disabled = false;
  setTimeout(()=>input.focus(), 50);
}

// This word's progress towards mastered, under the sentence
function showWordProgress(item){
  const el = document.getElementById("promptProgress");
  const st = itemState(statsCache, item.key);
  const n = (statsCache[item.key] || {}).streak || 0;
  el.innerHTML = st === "new" ? "New word" :
    st === "mastered" ? "★ Mastered — quick check" :
    st === "wrong" ? 'This word: <span class="dots">○○○</span> to fix' :
    'This word: ' + dotsHTML(n) + ' ' + STATE_WORDS[st] + ' (' + n + ' of 3 in a row)';
  el.classList.remove("hidden");
}

// After a wrong answer the correct spelling stays on screen until she
// taps Next (or presses Enter on a keyboard) — no auto-advance.
let pendingNext = null;
function waitForNext(fn){
  const btn = document.getElementById("nextBtn");
  document.getElementById("typeSubmit").classList.add("hidden");
  btn.classList.remove("hidden");
  const go = ()=>{
    if(pendingNext !== go) return; // guard against a double tap/Enter
    pendingNext = null;
    btn.classList.add("hidden");
    fn();
  };
  pendingNext = go;
  btn.onclick = go;
}
document.addEventListener("keydown", (e)=>{
  if(e.key === "Enter" && pendingNext){ e.preventDefault(); pendingNext(); }
});

document.getElementById("typeForm").addEventListener("submit", (e)=> e.preventDefault());
document.getElementById("typeSubmit").addEventListener("click", submitTyped);
document.getElementById("typeInput").addEventListener("keydown", (e)=>{
  if(e.key === "Enter"){ e.stopPropagation(); submitTyped(); }
});
function submitTyped(){
  if(answered) return;
  const item = quizQueue[quizIdx];
  const input = document.getElementById("typeInput");
  const raw = input.value;
  if(!raw.trim()) return;
  answered = true;
  const isCorrect = normalize(raw) === normalize(item.word);
  input.disabled = true;
  input.className = isCorrect ? "correct" : "wrong";
  const feedback = document.getElementById("feedback");
  const before = itemState(statsCache, item.key);
  recordResult(item, isCorrect);
  const n = statsCache[item.key].streak;
  if(isCorrect){
    quizScore++;
    if(n >= STREAK_TO_MASTER && before !== "mastered"){ quizNewlyMastered.add(item.key); feedback.textContent = "Correct! ★ Mastered!"; }
    else if(n >= STREAK_TO_MASTER) feedback.textContent = "Correct! ★ Still mastered";
    else feedback.textContent = "Correct! " + dots(n) + " " + (n >= 2 ? "nearly there" : "on the way") + " (" + n + " of 3 in a row)";
    feedback.className = "feedback good";
  } else {
    quizMissed.push(item);
    // in a practice round a missed word comes back once, a few questions later
    let note = "Back to ○○○ for this one.";
    if(wordSet !== "full" && !quizRetried.has(item.key)){
      quizRetried.add(item.key);
      quizQueue.splice(Math.min(quizIdx + 3, quizQueue.length), 0, item);
      note = "Back to ○○○ — it'll come back again later in this round.";
    }
    feedback.textContent = "Correct spelling: " + item.word + " · " + note;
    feedback.className = "feedback bad";
  }
  showWordProgress(item);
  document.getElementById("quizScore").textContent = "Score: " + quizScore;
  const advance = ()=>{
    quizIdx++;
    if(quizIdx >= quizQueue.length){
      finishQuiz();
    } else {
      renderQuestion();
    }
  };
  if(isCorrect) setTimeout(advance, 700);
  else waitForNext(advance);
}

function finishQuiz(){
  document.getElementById("quizPlay").classList.add("hidden");
  document.getElementById("quizResults").classList.remove("hidden");
  document.getElementById("progressFill").style.width = "100%";
  document.getElementById("resultScore").textContent = quizScore + " / " + quizQueue.length;
  const pct = Math.round(100*quizScore/quizQueue.length);
  let msg;
  if(pct === 100) msg = "Perfect score! \u{1F31F}";
  else if(pct >= 80) msg = "Great job — almost there!";
  else if(pct >= 50) msg = "Good start — keep practicing.";
  else msg = "Keep going, it'll stick with practice.";
  document.getElementById("resultMsg").textContent = msg;
  const sum = summarise(ITEMS, statsCache);
  const nm = quizNewlyMastered.size;
  document.getElementById("resultProgress").textContent = sum.mastered === sum.total ? "★ Every word in this week is mastered!" : "";
  document.getElementById("resultMastery").innerHTML = '<div class="result-mastery">' +
    '<div class="row"><span><b>' + sum.mastered + ' / ' + sum.total + '</b> words mastered</span>' +
    (nm ? '<span>★ ' + nm + ' new this round</span>' : '') + '</div>' +
    stackedBar(sum, true) + legend(sum, true) + '</div>';

  const seen = new Set();
  const missedThisRun = quizMissed.filter(item=>{
    if(seen.has(item.key)) return false;
    seen.add(item.key);
    return true;
  });

  const reviewWrap = document.getElementById("resultReviewWrap");
  const reviewList = document.getElementById("reviewList");
  reviewList.innerHTML = "";
  if(missedThisRun.length === 0){
    reviewWrap.classList.add("hidden");
  } else {
    reviewWrap.classList.remove("hidden");
    missedThisRun.forEach(item=>{
      const li = document.createElement("li");
      li.innerHTML = "<b>" + item.word + "</b><span>" + item.sentence + "</span>";
      reviewList.appendChild(li);
    });
  }

  updateRoundButtons();
}
</script>
